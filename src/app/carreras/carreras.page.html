<ion-header><ion-toolbar><ion-title>ÁMBAR · Carreras</ion-title></ion-toolbar></ion-header>
<ion-content><main class="page-wrap"><div class="page-intro"><div><div class="kicker">OFERTA EDUCATIVA</div><h1>Catálogo de carreras</h1><p>Agrega los programas educativos disponibles en el instituto.</p></div><ion-button fill="outline" routerLink="/home">← Volver al panel</ion-button></div>
<section class="panel" style="max-width:720px"><h2>Registrar carrera</h2><p class="muted">Define su nombre, una descripción opcional y su estado.</p><ion-item><ion-input label="Nombre de la carrera" labelPlacement="floating" type="text" maxlength="120" [(ngModel)]="carrera.nombre_carrera"></ion-input></ion-item><ion-item><ion-textarea label="Descripción" labelPlacement="floating" [autoGrow]="true" maxlength="255" [(ngModel)]="carrera.descripcion"></ion-textarea></ion-item><ion-item><ion-select label="Estatus" labelPlacement="floating" [(ngModel)]="carrera.estatus"><ion-select-option value="activo">Activo</ion-select-option><ion-select-option value="inactivo">Inactivo</ion-select-option></ion-select></ion-item><div class="page-actions"><ion-button [disabled]="guardando" (click)="validarGuardar()">{{ guardando ? 'Guardando...' : 'Guardar carrera' }}</ion-button><ion-button fill="outline" routerLink="/home">Cancelar</ion-button></div></section></main></ion-content>
